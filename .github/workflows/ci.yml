name: CI

on:
  push:
    branches: [main, feat/v0.1]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install base package
        run: python -m pip install .
      - name: Run offline unit tests
        run: python -m unittest discover -s tests

  mcp-stdio:
    name: MCP stdio (${{ matrix.sdk }}, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ['mcp==1.30.0', 'mcp>=2,<3']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional MCP transport
        run: python -m pip install '.[mcp]' '${{ matrix.sdk }}'
      - name: Run real MCP stdio round trips
        run: python -m unittest discover -s tests -p test_mcp_stdio.py -v
